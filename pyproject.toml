[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpha-forge"
version = "0.1.0"
description = "Adversarial, file-based, mutation-bounded crypto alpha research loop"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-frontmatter>=1.0",
    "anthropic>=0.40",
    "click>=8.1",
    "duckdb>=1.0",
    "pandas>=2.1",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
