providers:
  deepseek:
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
  openrouter:
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
  dgx_spark:
    api_key_env: DGX_SPARK_API_KEY
    base_url: http://192.168.3.46:8000/v1
tiers:
  heavy:
    provider: deepseek
    model: deepseek-v4-pro
  light:
    provider: dgx_spark
    model: gemma-4-31B-nvfp4

# Role routing:
#   heavy = DeepSeek-V4-Pro (official API) — critical paths: code gen + safety-critical judges.
#           Tied with Kimi K2.5 on quality (93% pass) but ~2.6x faster on plan generation
#           and meaningfully cheaper per token. See scripts/model_eval.py for the eval harness.
#   light = Gemma 4 31B local — advisory judges (tolerate 90% quality, save spend)
roles:
  researcher: heavy
  seed_judge: heavy
  leakage_judge: heavy
  code_judge: heavy
  result_judge: heavy
  overfit_judge: light
  realism_judge: light
  mutation_judge: light
