providers:
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
  openai:
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1

tiers:
  heavy:
    provider: anthropic
    model: claude-sonnet-4-20250514
  light:
    provider: openai
    model: gpt-4o-mini

roles:
  researcher: heavy
  seed_judge: heavy
  leakage_judge: light
  overfit_judge: heavy
  realism_judge: light
  code_judge: light
  result_judge: heavy
  mutation_judge: heavy
